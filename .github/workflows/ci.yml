name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Build API
        run: dotnet build backend/ProcessNavigator.Api --configuration Release

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/process-navigator-ui/package.json
      - name: Install dependencies
        working-directory: frontend/process-navigator-ui
        run: npm install
      - name: Build UI
        working-directory: frontend/process-navigator-ui
        run: npm run build
